<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ReSolve - 자격증 오답노트</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 24px auto; color: #111; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    textarea { height: 70px; }
    button { margin-top: 16px; padding: 8px 16px; background: #111; color: #fff; border: none; cursor: pointer; }
    #form-msg { margin-top: 12px; }
    .error { color: #c00; }
    nav button { margin-top: 0; margin-right: 4px; background: #fff; color: #111; border: 1px solid #111; }
    nav button.active { background: #111; color: #fff; }
    .hidden { display: none; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters select, .filters input { width: auto; flex: 1; }
    .item { border: 1px solid #ccc; padding: 12px; margin-top: 12px; }
    .item .meta { font-size: 13px; color: #555; }
    .item .q { margin: 6px 0; white-space: pre-wrap; }
    .item button { margin-top: 8px; padding: 4px 10px; }
    .item button.del { background: #fff; color: #c00; border: 1px solid #c00; }
    #cancel-edit { background: #fff; color: #111; border: 1px solid #111; }
    button.sub { background: #fff; color: #111; border: 1px solid #111; }
    .answer-label { margin: 12px 0 0; font-size: 13px; font-weight: bold; }
    #quiz-choice button { margin-right: 4px; }
    #quiz-progress, #quiz-last { font-size: 13px; color: #555; }
    #review-result { white-space: pre-line; }
    details { margin-top: 8px; border: 1px solid #ccc; padding: 8px 12px; }
    summary { cursor: pointer; font-weight: bold; }
    .hint { font-size: 13px; color: #555; margin: 8px 0 0; }
    #paste-text, #question { height: 140px; }
    #paste-msg { white-space: pre-line; }
  </style>
</head>
<body>
  <h1>ReSolve</h1>

  <nav>
    <button type="button" data-screen="review" class="active">오늘의 복습</button>
    <button type="button" data-screen="register">등록</button>
    <button type="button" data-screen="list">조회</button>
  </nav>

  <section id="review">
    <h2>오늘의 복습</h2>

    <div id="review-start">
      <p id="review-count"></p>
      <button type="button" id="start-review">복습 시작</button>
    </div>

    <div id="quiz" class="hidden">
      <p id="quiz-progress"></p>
      <div class="item">
        <div class="meta" id="quiz-meta"></div>
        <div class="q" id="quiz-question"></div>
        <div id="quiz-answer" class="hidden">
          <p class="answer-label">정답</p>
          <div class="q" id="quiz-answer-text"></div>
          <div id="quiz-explanation-box">
            <p class="answer-label">해설</p>
            <div class="q" id="quiz-explanation"></div>
          </div>
        </div>
      </div>
      <button type="button" id="show-answer">정답 보기</button>
      <span id="quiz-choice" class="hidden"></span>
      <span id="judge" class="hidden">
        <button type="button" id="mark-correct">맞았어요</button>
        <button type="button" id="mark-wrong" class="sub">틀렸어요</button>
      </span>
      <button type="button" id="quiz-next" class="hidden">다음 문제</button>
      <button type="button" id="stop-review" class="sub">그만하기</button>
      <p id="quiz-last"></p>
    </div>

    <div id="review-done" class="hidden">
      <p id="review-result"></p>
      <button type="button" id="back-review" class="sub">처음으로</button>
    </div>

    <p id="review-msg" class="error"></p>
  </section>

  <section id="register" class="hidden">
    <h2 id="form-title">오답 등록</h2>
    <details id="paste-box">
      <summary>문제 글 붙여넣어 칸 채우기</summary>
      <p class="hint">문제부터 보기·정답·해설까지 드래그해 복사한 뒤 붙여넣으세요.
        그림·표는 글자로 복사되지 않으니 필요하면 문제 칸에 직접 적어 주세요.
        바로 저장되지 않으니 채워진 내용을 확인한 뒤 저장을 누르세요.</p>
      <textarea id="paste-text" placeholder="여기에 붙여넣기 (Ctrl+V)"></textarea>
      <button type="button" id="paste-fill">칸 채우기</button>
      <p id="paste-msg"></p>
    </details>
    <form id="register-form">
      <label>과목 *
        <input id="subject" placeholder="예: SQLD">
      </label>
      <label>시험 구분
        <select id="examType">
          <option value="필기">필기</option>
          <option value="실기">실기</option>
        </select>
      </label>
      <label>단원
        <input id="unit" placeholder="예: 조인">
      </label>
      <label>문제 *
        <textarea id="question"></textarea>
      </label>
      <label>정답 *
        <textarea id="answer"></textarea>
      </label>
      <label>해설
        <textarea id="explanation"></textarea>
      </label>
      <label>출처
        <input id="source" placeholder="예: 2024년 1회">
      </label>
      <label>틀린 이유
        <input id="reason" placeholder="예: 개념 헷갈림">
      </label>
      <button type="submit" id="submit-btn">저장</button>
      <button type="button" id="cancel-edit" class="hidden">수정 취소</button>
    </form>
    <p id="form-msg"></p>
  </section>

  <section id="list" class="hidden">
    <h2>오답 조회</h2>
    <div class="filters">
      <select id="filter-subject">
        <option value="">전체 과목</option>
      </select>
      <select id="filter-exam">
        <option value="">필기·실기</option>
        <option value="필기">필기</option>
        <option value="실기">실기</option>
      </select>
      <select id="filter-unit">
        <option value="">전체 단원</option>
      </select>
      <select id="filter-box">
        <option value="">전체 상자</option>
        <option value="1">상자 1</option>
        <option value="2">상자 2</option>
        <option value="3">상자 3</option>
        <option value="4">상자 4</option>
        <option value="5">상자 5</option>
        <option value="done">졸업</option>
      </select>
      <input id="filter-keyword" placeholder="키워드">
    </div>
    <p id="list-count"></p>
    <div id="question-list"></div>
  </section>

  <script src="models.js"></script>
  <script src="parser.js"></script>
  <script src="storage.js"></script>
  <script src="scheduler.js"></script>
  <script src="app.js"></script>
</body>
</html>
